[project]
name = "economerc-backend"
version = "0.1.0"
description = "EconoMerc API — controle de compras de mercado, preços compartilhados por mercado"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4.13.0",
    "asyncpg>=0.31.0",
    "curl-cffi>=0.13.0",
    "fastapi[standard]>=0.118.0",
    "granian[uvloop]>=2.7.4",
    "nats-py>=2.14.0",
    "orjson>=3.11.9",
    "pydantic>=2.11.10",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
    "valkey>=6.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "src/api"]

[tool.hatch.build.targets.wheel.sources]
"config" = "config"
"src/api" = "api"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

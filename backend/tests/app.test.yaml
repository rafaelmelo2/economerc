postgres:
  pool:
    min_size: 1
    max_size: 5
    max_queries: 50000
    max_inactive_connection_lifetime: 300.0
    command_timeout: 30.0
    timeout: 10.0

# Nunca usada de fato: o app não roda `lifespan` nos testes (mesma convenção do
# padrão nexarena — `ASGITransport` não dispara startup/shutdown), então
# `init_valkey()` nunca é chamado. Path só precisa ser sintaticamente válido.
valkey:
  sock_path: /tmp/economerc-test-valkey-unused.sock
  cache_default_ttl: 60

nats:
  url: nats://localhost:4232
  name: economerc-backend-test
  connect_timeout: 1
  max_reconnect_attempts: 1
  reconnect_time_wait: 0.5

cors:
  allow_origins: ["http://localhost:5180"]
  allow_credentials: true
  allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
  allow_headers: ["Content-Type", "Authorization"]
  expose_headers: ["X-Request-ID"]
  max_age: 600

cookies:
  secure: false

auth:
  refresh_token:
    ttl_days: 30
    absolute_lifetime_days: 60
    # 0 no teste: torna a janela de graça (auth-hardened.md §3a) determinística
    # — reuso do token antigo derruba a família de imediato, sem depender do
    # relógio da máquina de CI ficar dentro/fora de uma janela de segundos.
    reuse_grace_seconds: 0
    gc_retention_seconds: 3600
  google:
    client_id_ios: "test-google-ios-client-id"
    client_id_android: "test-google-android-client-id"
    client_id_web: "test-google-web-client-id"
    jwks_url: https://www.googleapis.com/oauth2/v3/certs
    jwks_cache_ttl_seconds: 3600
  apple:
    bundle_id: "com.economerc.app.test"
    service_id: "com.economerc.app.test.web"
    jwks_url: https://appleid.apple.com/auth/keys
    jwks_cache_ttl_seconds: 3600

logging:
  service_name: economerc-backend-test
  app_env: test
  level: WARNING
  format: console

ai:
  base_url: https://openrouter.ai/api/v1
  tasks:
    price_tag_ocr:
      model: google/gemini-flash-latest
      temperature: 0.1
      max_tokens: 1024
      timeout_s: 8
    categorize_product:
      model: google/gemini-2.5-flash-lite
      temperature: 0.0
      max_tokens: 256
      timeout_s: 5
    flyer_extract:
      model: google/gemini-flash-latest
      temperature: 0.1
      max_tokens: 2048
      timeout_s: 15
